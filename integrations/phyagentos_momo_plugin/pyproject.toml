[project]
name = "phyagentos-momo-plugin"
version = "0.1.0"
description = "Direct MomoAgent robotic arm plugin for PhyAgentOS"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "MoceAI"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["phyagentos_momo_plugin"]

[tool.hatch.build]
include = [
  "phyagentos_momo_plugin/**/*.py",
  "phyagentos_momo_plugin/profiles/**/*.md",
  "runtime/**/*",
  "tests/**/*",
  "README.md",
  "README_ZH.md",
  "PhyAgentOS_plugin.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
